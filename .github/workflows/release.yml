name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - major-dev
          - minor-dev
          - patch-dev
          - dev
          - stable
        default: dev

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  jukebox:
    name: Jukebox
    uses: ./.github/workflows/_jukebox.yml

  admin-ui:
    name: Admin UI
    uses: ./.github/workflows/_admin-ui.yml

  publish:
    name: Bump, Tag & Publish
    needs: [jukebox, admin-ui]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Get app user ID
        id: user-id
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download admin-ui bundle
        uses: actions/download-artifact@v8
        with:
          name: admin-ui-dist
          path: jukebox/adapters/inbound/admin/static/

      - name: Assert release branch is main
        run: |
          if [ "$REF_NAME" != "main" ]; then
            echo "Release must be dispatched from main, got: $REF_NAME"
            exit 1
          fi
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Bump version
        run: |
          case "$BUMP" in
            major-dev)  uv version --bump major --bump dev ;;
            minor-dev)  uv version --bump minor --bump dev ;;
            patch-dev)  uv version --bump patch --bump dev ;;
            *)          uv version --bump "$BUMP" ;;
          esac
        env:
          BUMP: ${{ inputs.bump }}

      - name: Get version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Commit, push & tag
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "🔖 v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${REF_NAME}" "v${VERSION}"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.user-id.outputs.user-id }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub Release
        if: "!contains(steps.version.outputs.version, '.dev')"
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
