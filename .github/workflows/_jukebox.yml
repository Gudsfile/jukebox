name: Jukebox

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version (leave empty for all)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version (leave empty for all)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ${{ fromJson(
          inputs.python-version != ''
          && format('["{0}"]', inputs.python-version)
          || '["3.11", "3.12", "3.13", "3.14"]'
          ) }}
        extras: ["--all-extras"]
        include:
          - python-version: ${{ inputs.python-version != '' && inputs.python-version || '3.13' }}
            extras: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.extras }} --dev

      - name: Lint
        run: uv run ruff check --output-format github

      - name: Check formatting
        run: uv run ruff format --check --output-format github

      - name: Type check
        # Skip on the no-extras variant: optional dependencies (fastapi, pn532, ...)
        # are guarded at runtime via `try/except ModuleNotFoundError`, but ty cannot infer
        # that semantically and reports false-positive `unresolved-import` errors.
        if: matrix.extras != ''
        run: uv run ty check --output-format github --exit-zero-on-warning

      - name: Test
        run: uv run pytest

      - name: Build
        # One build is enough: the package does not depend on the Python version or the extras.
        if: matrix.extras == ''
        run: uv build
