name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "admin-ui/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_PROJECT_ENVIRONMENT: $pythonLocation

jobs:
  test-and-lint:
    name: Run Tests & Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ${{ fromJson(
          github.event_name == 'workflow_dispatch' && github.event.inputs.python-version != ''
          && format('["{0}"]', github.event.inputs.python-version)
          || '["3.11", "3.12", "3.13"]'
          ) }}
        extras: ["--all-extras"]
        include:
          - python-version: ${{
              github.event_name == 'workflow_dispatch' && github.event.inputs.python-version != ''
              && format('{0}', github.event.inputs.python-version)
              || '3.13'
              }}
            extras: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked ${{ matrix.extras }} --dev

      - name: Check format with ruff
        run: uv run ruff format --check --output-format github

      - name: Lint with ruff
        run: uv run ruff check --output-format github

      - name: Test with pytest
        run: uv run pytest

      - name: Type check with ty
        # Skip on the no-extras variant: optional dependencies (fastapi, fastui, pn532, ...)
        # are guarded at runtime via `try/except ModuleNotFoundError`, but ty cannot infer
        # that semantically and reports false-positive `unresolved-import` errors.
        if: matrix.extras != ''
        run: uv run ty check --output-format github --exit-zero-on-warning

  build:
    name: Build Package
    needs: test-and-lint
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin-ui dependencies
        run: npm ci
        working-directory: admin-ui

      - name: Build admin-ui
        run: npm run build
        working-directory: admin-ui

      - name: Copy admin-ui bundle into the package
        run: |
          rm -rf jukebox/adapters/inbound/admin/static
          mkdir -p jukebox/adapters/inbound/admin/static
          cp -r admin-ui/dist/. jukebox/adapters/inbound/admin/static/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build package
        run: uv build

      - name: Upload package artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: built-package
          path: dist/
