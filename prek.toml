[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0" # Ruff version.
hooks = [
  # Run the linter.
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },

  # Run the formatter.
  { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.10.12" # uv version.
hooks = [
    # Update the uv lockfile
    { id = "uv-lock" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "admin-ui-format",
    name = "admin-ui prettier format",
    language = "system",
    entry = "npm --prefix admin-ui run format",
    files = "^admin-ui/",
    exclude = "^admin-ui/(dist|node_modules)/",
    pass_filenames = false,
  },
  {
    id = "admin-ui-lint",
    name = "admin-ui eslint",
    language = "system",
    entry = "npm --prefix admin-ui run lint -- --fix",
    files = "^admin-ui/",
    exclude = "^admin-ui/(dist|node_modules)/",
    pass_filenames = false,
  },
]
